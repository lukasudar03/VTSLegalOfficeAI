services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vts_legal_office_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vts_legal_office_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vts_legal_office_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
